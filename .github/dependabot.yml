version: 2

updates:
  # Update npm packages
  - package-ecosystem: npm
    directory: /
    open-pull-requests-limit: 10

    # Keep coupled toolchains together, including majors; otherwise group routine updates
    groups:
      vitest:
        patterns:
          - 'vitest'
          - '@vitest/*'

      babel:
        patterns:
          - '@babel/*'

      runtime-dependencies:
        dependency-type: production
        patterns:
          - '*'
        update-types:
          - minor
          - patch

      development-dependencies:
        dependency-type: development
        patterns:
          - '*'
        update-types:
          - minor
          - patch

    ignore:
      - dependency-name: 'eslint-*'
      - dependency-name: 'eslint'

    # Schedule run every Monday, local time
    schedule:
      interval: weekly
      time: '10:30'
      timezone: 'Europe/London'

    versioning-strategy: increase

    allow:
      # Include direct package.json updates
      - dependency-type: direct

  # Update GitHub Actions
  - package-ecosystem: github-actions
    directory: /

    groups:
      github-actions:
        patterns:
          - '*'
        update-types:
          - minor
          - patch

    # Schedule run every Monday, local time
    schedule:
      interval: weekly
      time: '10:30'
      timezone: 'Europe/London'
